name: CI

on:
  push:
    branches: [unstable, main]
  pull_request:
    branches: [unstable, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out integrate-observe
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify public source excludes private records
        run: |
          test ! -e AGENTS.md
          test ! -e COPYRIGHT
          test ! -e publication
          test ! -e tools
          test -f LICENSE
          test -f LICENSES/BSD-3-Clause.txt
          test -f LICENSES/GPL-3.0-only.txt
      - name: Run source-layout suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Check wheel namespace layout
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "zog/integrate_observe/__init__.py" in names
          assert "zog/integrate_observe/cli.py" in names
          assert "zog/__init__.py" not in names
          assert not any(name.startswith("integrate_observe/") for name in names)
          PY
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify installed namespace and entry point
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib.util
          import zog.integrate_observe
          from zog.integrate_observe.cli import main

          assert zog.integrate_observe.__version__ == "0.4.2"
          assert callable(main)
          legacy = "integrate_" + "observe"
          assert importlib.util.find_spec(legacy) is None
          PY
